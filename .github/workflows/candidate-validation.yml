name: Candidate Validation

on:
  push:
    branches:
      - "candidate/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-smoke:
    name: Syntax and smoke tests (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Wrangler D1 release configuration
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("wrangler.toml").read_text(encoding="utf-8"))
          bindings = config.get("d1_databases", [])
          assert len(bindings) == 1, f"expected exactly one D1 binding, got {len(bindings)}"
          binding = bindings[0]
          assert binding.get("binding") == "DB", "D1 binding must be named DB"
          assert binding.get("database_name") == "2020khoda-crm", "unexpected D1 database name"
          assert binding.get("database_id") == "25e5ebc9-4809-4028-ab26-349ba359c53f", "unexpected D1 database ID"
          assert "preview_database_id" not in binding, "preview must not point at production D1"
          print("PASS: Wrangler D1 binding matches the audited target; preview is isolated.")
          PY
      - name: Check Worker syntax
        run: npm run check
      - name: Run smoke and D1 schema compatibility tests
        run: npm test
