name = "2020khoda-global-ai-core"
main = "src/index.js"
compatibility_date = "2026-11-05"

# Production D1 target for the human-approved release.
# Candidate configuration only; no Worker deployment is performed here.
[[d1_databases]]
binding = "DB"
database_name = "2020khoda-crm"
database_id = "25e5ebc9-4809-4028-ab26-349ba359c53f"

# Production Worker AI binding. The application source calls env.AI.run().
# This Candidate setting is not applied to Cloudflare until an approved release.
[ai]
binding = "AI"

# Worker Previews do not inherit production bindings. Keep the Preview isolated:
# Workers AI is available for preview inference, but production D1 is deliberately
# NOT bound. DB-backed endpoints must remain unavailable until a separate
# non-production D1 database is provisioned and explicitly bound here.
[previews]
[previews.ai]
binding = "AI"
